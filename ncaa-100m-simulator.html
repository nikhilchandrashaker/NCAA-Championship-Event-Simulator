<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCAA Event Monte Carlo Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --line:#f2e9dc; --board:#12100d; --board2:#1c1712; --amber:#ffb545; --paper:#f2ede2;
  --muted:#9c8f7d; --good:#5fae72; --card:#171310;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--board);color:var(--paper);font-family:'Courier New',monospace;}
body{padding:18px 14px 40px;}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.35rem;margin:0 0 2px;letter-spacing:.3px;}
.sub{color:var(--muted);font-size:.78rem;margin-bottom:14px;}
.note{background:var(--card);border-left:3px solid var(--amber);padding:10px 12px;font-size:.75rem;color:var(--muted);margin-bottom:16px;line-height:1.5;max-width:760px;}
.panel{background:var(--card);border:1px solid #2a231b;border-radius:6px;padding:14px;margin-bottom:14px;max-width:760px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
label{font-size:.72rem;color:var(--muted);}
select,button{font-family:inherit;font-size:.83rem;background:var(--board2);color:var(--paper);border:1px solid #3a2f22;border-radius:4px;padding:6px 10px;}
button{background:var(--amber);color:#1b140f;font-weight:bold;cursor:pointer;border:none;}
button:hover{filter:brightness(1.08);}
button:disabled{opacity:.4;cursor:default;filter:none;}
button.ghost{background:var(--board2);color:var(--paper);border:1px solid #3a2f22;}

.trackWrap{max-width:760px;background:#2f6b3a;border-radius:8px;padding:14px;margin-bottom:14px;}
.trackWrap svg{width:100%;height:auto;display:block;}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 14px;margin-top:10px;}
.legRow{display:flex;align-items:center;gap:6px;font-size:.7rem;}
.dot{width:10px;height:10px;border-radius:50%;flex:none;}
.legName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.legTime{color:var(--amber);font-weight:bold;min-width:52px;text-align:right;}

.field{max-width:760px;margin-bottom:14px;}
.fbar-row{display:grid;grid-template-columns:112px 1fr 64px;align-items:center;gap:8px;height:24px;margin-bottom:4px;}
.fbar-name{font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fbar-track{background:rgba(0,0,0,.25);border-radius:3px;height:11px;}
.fbar-fill{height:100%;background:var(--amber);border-radius:3px;width:0;transition:width 1.2s cubic-bezier(.2,.7,.3,1);}
.fbar-val{font-size:.68rem;text-align:right;color:var(--muted);}

.arena{max-width:760px;background:#5b4636;border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.arow{display:grid;grid-template-columns:108px 1fr 58px;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08);}
.arow:last-child{border-bottom:none;}
.aname{font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.aval{font-size:.68rem;text-align:right;color:var(--amber);font-weight:bold;}
.arena svg{display:block;width:100%;height:46px;}

table{width:100%;max-width:760px;border-collapse:collapse;font-size:.76rem;}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #2a231b;}
th{color:var(--muted);font-weight:normal;font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;}
.bar{height:15px;background:#2a231b;border-radius:3px;overflow:hidden;width:100%;}
.fill{height:100%;background:var(--amber);}
.med{color:var(--good);font-weight:bold;}
.empty{color:var(--muted);font-size:.8rem;padding:10px 2px;}
</style>
</head>

function fmtTime(v){
  if(v>=60){ const m=Math.floor(v/60), s=v-m*60; return m+':'+(s<10?'0':'')+s.toFixed(2); }
  return v.toFixed(2);
}
function fmtVal(v,u){
  if(u==='time') return fmtTime(v);
  if(u==='distance') return v.toFixed(2)+'m';
  return Math.round(v).toString();
}
function sdFor(v,u){
  if(u==='time'){ if(v<30) return v*0.006; if(v<120) return v*0.008; return v*0.01; }
  if(u==='distance') return v*0.025;
  return v*0.015;
}
function gauss(mean,sd){
  const u=1-Math.random(), v=Math.random();
  return mean + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function unique(arr){ return [...new Set(arr)].sort(); }

const BASE_MS = 6000;
const PAD=22, R0=34, LANE_W=11, STRAIGHT=300;

function laneGeom(n){
  const outerR = R0 + (n-1)*LANE_W;
  const xLeft = PAD + outerR;
  const xRight = xLeft + STRAIGHT;
  const cy = PAD + outerR;
  const w = xRight + outerR + PAD;
  const h = 2*outerR + 2*PAD;
  const lanes = Array.from({length:n}, (_,i)=>{
    const r = R0 + i*LANE_W;
    const d = `M ${xLeft} ${cy-r} L ${xRight} ${cy-r} A ${r} ${r} 0 0 1 ${xRight} ${cy+r} L ${xLeft} ${cy+r} A ${r} ${r} 0 0 1 ${xLeft} ${cy-r} Z`;
    return {r,d};
  });
  return {outerR,xLeft,xRight,cy,w,h,lanes};
}

function App(){
  const champs = useMemo(()=>unique(DATA.map(d=>d.c)),[]);
  const [champ,setChamp] = useState(champs[0]);
  const genders = useMemo(()=>unique(DATA.filter(d=>d.c===champ).map(d=>d.g)),[champ]);
  const [gender,setGender] = useState(genders[0]);
  const events = useMemo(()=>unique(DATA.filter(d=>d.c===champ&&d.g===gender).map(d=>d.e)),[champ,gender]);
  const [event,setEvent] = useState(events[0]);
  const [numSims,setNumSims] = useState(10000);
  const [results,setResults] = useState(null);
  const [raceVals,setRaceVals] = useState(null);
  const [isPaused,setIsPaused] = useState(false);
  const [isRunning,setIsRunning] = useState(false);
  const [tick_,forceTick] = useState(0);

  useEffect(()=>{ const gs=unique(DATA.filter(d=>d.c===champ).map(d=>d.g)); if(!gs.includes(gender)) setGender(gs[0]); },[champ]);
  useEffect(()=>{ const es=unique(DATA.filter(d=>d.c===champ&&d.g===gender).map(d=>d.e)); if(!es.includes(event)) setEvent(es[0]); },[champ,gender]);

  const entrants = useMemo(()=>{
    const rows = DATA.filter(d=>d.c===champ&&d.g===gender&&d.e===event);
    const unit = rows.length? rows[0].u : 'time';
    const sorted = [...rows].sort((a,b)=> unit==='time' ? a.v-b.v : b.v-a.v);
    return {rows:sorted, unit};
  },[champ,gender,event]);

  useEffect(()=>{ setResults(null); setRaceVals(null); setIsRunning(false); setIsPaused(false); },[champ,gender,event]);

  const rafRef = useRef(null);
  const startRef = useRef(0);
  const pausedElapsedRef = useRef(0);
  const runnersRef = useRef([]);
  const pathRefs = useRef([]);
  const lengthsRef = useRef([]);

  const n = entrants.rows.length;
  const geom = useMemo(()=>laneGeom(Math.max(n,1)), [n]);

  useEffect(()=>{
    pathRefs.current = new Array(n).fill(null);
    lengthsRef.current = new Array(n).fill(0);
  },[n]);

  function stopLoop(){ if(rafRef.current) cancelAnimationFrame(rafRef.current); rafRef.current=null; }

  function tick(){
    const now = performance.now();
    const elapsed = pausedElapsedRef.current + (now - startRef.current);
    let allDone = true;
    const next = {};
    runnersRef.current.forEach(r=>{
      const progress = Math.min(1, elapsed / r.duration);
      if(progress < 1) allDone = false;
      next[r.id] = {v:r.v, progress, finished:progress>=1};
    });
    setRaceVals(next);
    if(!allDone){ rafRef.current = requestAnimationFrame(tick); }
    else { setIsRunning(false); }
  }

  function startRace(sampleVals){
    stopLoop();
    const unit = entrants.unit;
    let byId;
    if(unit==='time'){
      const minV = Math.min(...sampleVals);
      byId = entrants.rows.map((r,i)=>({id:i, v:sampleVals[i], duration: BASE_MS*(sampleVals[i]/minV)}));
    } else {
      const maxV = Math.max(...sampleVals);
      byId = entrants.rows.map((r,i)=>({id:i, v:sampleVals[i], duration: BASE_MS*(maxV/sampleVals[i])}));
    }
    runnersRef.current = byId;
    pausedElapsedRef.current = 0;
    startRef.current = performance.now();
    setIsPaused(false);
    setIsRunning(true);
    setRaceVals(Object.fromEntries(byId.map(r=>[r.id,{v:r.v,progress:0,finished:false}])));
    // ensure lengths measured before first frame
    requestAnimationFrame(()=>{
      pathRefs.current.forEach((el,i)=>{ if(el) lengthsRef.current[i]=el.getTotalLength(); });
      rafRef.current = requestAnimationFrame(tick);
    });
  }

  function togglePause(){
    if(!isRunning) return;
    if(isPaused){
      startRef.current = performance.now();
      setIsPaused(false);
      rafRef.current = requestAnimationFrame(tick);
    } else {
      pausedElapsedRef.current += performance.now() - startRef.current;
      stopLoop();
      setIsPaused(true);
    }
  }

  function runSimulation(){
    if(!entrants.rows.length) return;
    const unit = entrants.unit;
    const higherBetter = unit!=='time';
    const nn = numSims;
    const wins = Array(entrants.rows.length).fill(0);
    const top3 = Array(entrants.rows.length).fill(0);
    const allVals = entrants.rows.map(()=>[]);
    let lastDraw = null;
    for(let s=0;s<nn;s++){
      const vals = entrants.rows.map(a=>Math.max(0.01,gauss(a.v,sdFor(a.v,unit))));
      vals.forEach((v,i)=>allVals[i].push(v));
      const ranked = vals.map((v,i)=>[v,i]).sort((a,b)=> higherBetter? b[0]-a[0] : a[0]-b[0]);
      wins[ranked[0][1]]++;
      ranked.slice(0,3).forEach(r=>top3[r[1]]++);
      lastDraw = vals;
    }
    const rows = entrants.rows.map((a,i)=>{
      const sorted=[...allVals[i]].sort((x,y)=>x-y);
      const median=sorted[Math.floor(sorted.length/2)];
      return {a, winPct:100*wins[i]/nn, top3Pct:100*top3[i]/nn, median};
    }).sort((x,y)=>y.winPct-x.winPct);
    setResults({rows, unit});
    startRace(lastDraw);
  }

  useEffect(()=>()=>stopLoop(),[]);

  const unit = entrants.unit;
  const isTrack = unit==='time';
  const maxWin = results ? Math.max(...results.rows.map(r=>r.winPct),1) : 1;

  function runnerPoint(i){
    const rv = raceVals && raceVals[i];
    const lane = geom.lanes[i];
    if(!lane) return {x:0,y:0};
    if(!rv || !pathRefs.current[i] || !lengthsRef.current[i]){
      return {x:geom.xLeft, y:geom.cy-lane.r};
    }
    const len = lengthsRef.current[i];
    const pt = pathRefs.current[i].getPointAtLength(rv.progress*len);
    return {x:pt.x, y:pt.y};
  }

  return (
    <div>
      <h1>NCAA Championship Event Simulator</h1>
      <div className="sub">2026 {champ} — {gender} {event} Final · Monte Carlo simulation from real finalist data</div>
      <div className="note">This dataset holds one final-round mark per athlete per event — no season or qualifying history — so there isn't enough data to measure any athlete's real variability. The spread used below is a modeled assumption (typical meet-to-meet variation by event type), not something measured from this athlete's results. Treat every output as illustrative simulation, not prediction. The track shows one lap per race as a stylized lane visual, not the literal race distance, and jumps/throws are shown as simplified flight-path animations scaled relative to the field, not physically modeled trajectories.</div>

      <div className="panel">
        <div className="row">
          <label>Championship</label>
          <select value={champ} onChange={e=>setChamp(e.target.value)}>{champs.map(c=><option key={c} value={c}>{c}</option>)}</select>
          <label>Gender</label>
          <select value={gender} onChange={e=>setGender(e.target.value)}>{genders.map(g=><option key={g} value={g}>{g}</option>)}</select>
          <label>Event</label>
          <select value={event} onChange={e=>setEvent(e.target.value)}>{events.map(ev=><option key={ev} value={ev}>{ev}</option>)}</select>
        </div>
        <div className="row">
          <label>Simulations</label>
          <select value={numSims} onChange={e=>setNumSims(parseInt(e.target.value))}>
            <option value={1000}>1,000</option>
            <option value={10000}>10,000</option>
          </select>
          <button onClick={runSimulation}>▶ Run Simulation</button>
          <button className="ghost" onClick={togglePause} disabled={!isRunning}>{isPaused ? '⏵ Resume' : '⏸ Pause'}</button>
        </div>
      </div>

      {isTrack ? (
        <div className="trackWrap">
          <svg viewBox={`0 0 ${geom.w} ${geom.h}`}>
            {geom.lanes.map((lane,i)=>(
              <path key={i} ref={el=>pathRefs.current[i]=el} d={lane.d} fill="none" stroke="rgba(255,255,255,0.18)" strokeWidth={LANE_W-1.5}/>
            ))}
            <line x1={geom.xLeft} y1={geom.cy-geom.outerR-4} x2={geom.xLeft} y2={geom.cy-R0+4} stroke="#f2ede2" strokeWidth="2"/>
            {entrants.rows.map((a,i)=>{
              const pt = runnerPoint(i);
              return <circle key={i} cx={pt.x} cy={pt.y} r="6.5" fill={COLORS[i%COLORS.length]} stroke="#12100d" strokeWidth="1.2"/>;
            })}
          </svg>
          <div className="legend">
            {entrants.rows.map((a,i)=>{
              const rv = raceVals && raceVals[i];
              return (
                <div className="legRow" key={i}>
                  <div className="dot" style={{background:COLORS[i%COLORS.length]}}></div>
                  <div className="legName">{a.n}</div>
                  <div className="legTime">{rv && rv.finished ? fmtVal(rv.v,unit) : ''}</div>
                </div>
              );
            })}
          </div>
        </div>
      ) : event==='Heptathlon' ? (
        <div className="field">
          {entrants.rows.map((a,i)=>{
            const rv = raceVals && raceVals[i];
            const pct = rv ? Math.min(100, rv.progress*100) : 0;
            return (
              <div className="fbar-row" key={i}>
                <div className="fbar-name">{a.n}</div>
                <div className="fbar-track"><div className="fbar-fill" style={{width:pct+'%'}}></div></div>
                <div className="fbar-val">{rv && rv.finished ? fmtVal(rv.v,unit) : ''}</div>
              </div>
            );
          })}
        </div>
      ) : (
        <div className="arena">
          {entrants.rows.map((a,i)=>{
            const rv = raceVals && raceVals[i];
            const prog = rv ? rv.progress : 0;
            const fieldMax = Math.max(...entrants.rows.map(r=>r.v))*1.12;
            const frac = Math.min(1, a.v/fieldMax);
            const curVal = rv ? rv.v : a.v;
            const curFrac = Math.min(1, curVal/fieldMax);
            let marker;
            if(event==='High Jump'){
              const groundY=42, topY=8;
              const landY = groundY - (groundY-topY)*curFrac;
              const y = groundY - prog*(groundY-landY);
              const x = 24 + Math.min(prog/0.5,1)*40;
              marker = (
                <svg viewBox="0 0 220 48">
                  <line x1="10" y1={groundY} x2="210" y2={groundY} stroke="rgba(255,255,255,.35)" strokeWidth="1"/>
                  {rv && rv.finished && <line x1="55" y1={landY} x2="150" y2={landY} stroke="#f2ede2" strokeWidth="2"/>}
                  <circle cx={x} cy={y} r="5.5" fill={COLORS[i%COLORS.length]} stroke="#12100d" strokeWidth="1"/>
                </svg>
              );
            } else {
              const startX=14, endX=200;
              const landX = startX + (endX-startX)*curFrac;
              const x = startX + prog*(landX-startX);
              const y = 40 - Math.sin(Math.min(prog,1)*Math.PI)*20;
              marker = (
                <svg viewBox="0 0 220 48">
                  <line x1="10" y1="40" x2="210" y2="40" stroke="rgba(255,255,255,.35)" strokeWidth="1"/>
                  <circle cx="14" cy="40" r="4" fill="rgba(255,255,255,.5)"/>
                  {rv && rv.finished && <line x1={landX} y1="34" x2={landX} y2="46" stroke="#f2ede2" strokeWidth="2"/>}
                  <circle cx={x} cy={y} r="5.5" fill={COLORS[i%COLORS.length]} stroke="#12100d" strokeWidth="1"/>
                </svg>
              );
            }
            return (
              <div className="arow" key={i}>
                <div className="aname">{a.n}</div>
                {marker}
                <div className="aval">{rv && rv.finished ? fmtVal(rv.v,unit) : ''}</div>
              </div>
            );
          })}
        </div>
      )}

      <div className="panel">
        <table>
          <thead><tr><th>Athlete / Team</th><th>School</th><th>{isTrack?'Win %':'Best %'}</th><th>Top 3 %</th><th>Median</th></tr></thead>
          <tbody>
            {!results && <tr><td colSpan="5" className="empty">Run a simulation to see results.</td></tr>}
            {results && results.rows.map((r,i)=>(
              <tr key={i}>
                <td>{r.a.n}</td>
                <td>{r.a.s}</td>
                <td><div className="bar"><div className="fill" style={{width:(100*r.winPct/maxWin)+'%'}}></div></div>{r.winPct.toFixed(1)}%</td>
                <td>{r.top3Pct.toFixed(1)}%</td>
                <td className="med">{fmtVal(r.median,unit)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
